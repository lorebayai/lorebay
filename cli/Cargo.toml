[package]
name = "lorebay-cli"
description = "The Lorebay command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lorebay"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
httpdate.workspace = true
lorebay-lib-types.workspace = true
reqwest = { workspace = true, features = ["query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "signal", "time"] }
typed-builder.workspace = true
url.workspace = true
webbrowser.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "sync"] }

[[test]]
name = "api"
path = "tests/api/main.rs"

[lints]
workspace = true
