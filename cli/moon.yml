language: 'rust'
layer: 'application'

tasks:
  deny:
    command: 'python3 -B .moon/release.py deny cli'
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
  build:
    outputs: ['/target/debug/lorebay']
  integration:
    deps: ['lorebayd:build']
    inputs:
      - '/lorebayd/**/*'
      - '/lib/**/*'
      - '/base/**/*'
      - '/web/**/*'
  test:
    command: 'cargo test --bins --locked'
    options:
      mergeArgs: 'replace'
