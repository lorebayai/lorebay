language: 'rust'
layer: 'application'

tasks:
  build:
    outputs: ['/target/debug/lorebay']
  integration:
    deps: ['lorebayd:build']
    inputs:
      - '/lorebayd/**/*'
      - '/base/**/*'
      - '/web/**/*'
  test:
    command: 'cargo test --bins --locked'
    options:
      mergeArgs: 'replace'
