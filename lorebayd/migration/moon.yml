language: 'rust'
layer: 'library'

fileGroups:
  rust:
    - '/lib/migration/src/**/*'
    - '/lib/migration/Cargo.toml'

tasks:
  build:
    args: ['--features', 'entity-generation']
  lint:
    command: 'cargo clippy --all-targets --locked --features entity-generation -- -D warnings'
    options:
      mergeArgs: 'replace'
  test:
    args: ['--features', 'entity-generation']
  generate-entities:
    command: 'bash lorebayd/migration/scripts/generate-entities.sh'
    inputs:
      - '@group(rust)'
      - 'scripts/**/*'
      - '/lib/migration/scripts/entity-generation.sh'
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
