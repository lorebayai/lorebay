language: 'rust'
layer: 'application'

dependsOn:
  - web

fileGroups:
  rust:
    - '/lib/core/src/**/*'
    - '/lib/mcp/src/**/*'
    - '/lib/migration/**/*'
    - 'migration/**/*'
    - '/lib/types/src/**/*'

tasks:
  build:
    deps: ['web:build']
    outputs: ['/target/debug/lorebayd']
  lint:
    deps: ['web:build']
  test:
    deps: ['web:build']
  integration:
    deps: ['web:build']
