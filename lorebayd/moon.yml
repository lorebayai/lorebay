language: 'rust'
layer: 'application'

dependsOn:
  - web

fileGroups:
  rust:
    - '/lib/core/src/**/*'
    - '/lib/mcp/src/**/*'
    - '/lib/types/src/**/*'

tasks:
  build:
    deps: ['web:build']
    outputs: ['/target/debug/lorebayd']
  lint:
    deps: ['web:build']
  test:
    deps: ['web:build']
  integration:
    deps: ['web:build']
  generate-entities:
    command: 'bash lorebayd/scripts/generate-entities.sh'
    inputs:
      - '/lorebayd/scripts/generate-entities.sh'
      - '/schema/**/*'
      - '/lib/core/src/migration/**/*'
      - 'src/migration/**/*'
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
