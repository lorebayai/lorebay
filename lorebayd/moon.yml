language: 'rust'
layer: 'application'

dependsOn:
  - web

tasks:
  build:
    deps: ['web:build']
  lint:
    deps: ['web:build']
  test:
    deps: ['web:build']
  integration:
    deps: ['web:build']
  generate-entities:
    command: 'bash lorebayd/scripts/generate-entities.sh'
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
