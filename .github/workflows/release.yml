name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Check Release Version
        env:
          CI: ''
        run: moon run lorebayd:release-version
      - name: Install Rust Toolchain
        run: rustup toolchain install --no-self-update
      - name: Check Release Dependencies
        env:
          # moon refuses runInCI: false tasks while CI is set.
          CI: ''
        run: moon run lorebayd:deny cli:deny
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Install Rust Toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Build Tools
        env:
          CI: ''
        run: moon run lorebayd:release-setup
      - name: Build Release Executables
        env:
          CI: ''
        run: moon run lorebayd:release-build cli:release-build
      - name: Pack Release Archives
        env:
          CI: ''
        run: moon run lorebayd:release-package cli:release-package
      - name: Upload Release Archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: target/release-archives/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Download Release Archives
        uses: actions/download-artifact@v8.0.2
        with:
          path: target/release-archives
          merge-multiple: true
      - name: Create Draft Release
        env:
          CI: ''
          GH_TOKEN: ${{ github.token }}
        run: moon run lorebayd:release-publish
