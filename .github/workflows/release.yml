name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Check Release Version
        env:
          CI: ''
        run: moon run lorebayd:release-version
      - name: Install Rust Toolchain
        run: rustup toolchain install --no-self-update
      - name: Check Release Dependencies
        env:
          # moon refuses runInCI: false tasks while CI is set.
          CI: ''
        run: moon run lorebayd:deny cli:deny
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Install Rust Toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Build Tools
        env:
          CI: ''
        run: moon run lorebayd:release-setup
      - name: Build Release Executables
        env:
          CI: ''
        run: moon run lorebayd:release-build cli:release-build
      - name: Pack Release Archives
        env:
          CI: ''
        run: moon run lorebayd:release-package cli:release-package
      - name: Build Server Image
        env:
          CI: ''
        run: moon run deploy:image-build
      - name: Smoke Server Image
        env:
          CI: ''
        run: moon run deploy:image-smoke
      - name: Upload Smoked Image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-${{ matrix.target }}
          path: target/release-images/${{ matrix.target }}/
          if-no-files-found: error
      - name: Upload Release Archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: archives-${{ matrix.target }}
          path: target/release-archives/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error
  push:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      CI: ''
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Install Image Tools
        run: moon run deploy:image-setup
      - name: Download Smoked Image
        uses: actions/download-artifact@v8.0.2
        with:
          name: image-${{ matrix.target }}
          path: target/release-images/${{ matrix.target }}
      - name: Authenticate Image Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push Smoked Digest
        run: moon run deploy:image-push
  manifest:
    needs: push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Download Smoked Digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: target/release-images
      - name: Authenticate Image Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag Combined Manifest
        id: manifest
        env:
          CI: ''
        run: moon run deploy:image-manifest
  prepare:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Download Release Archives
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: archives-*
          path: target/release-archives
          merge-multiple: true
      - name: Prepare Deployment Assets
        env:
          CI: ''
        run: moon run lorebayd:release-assets
      - name: Upload Release Downloads
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-downloads
          path: target/release-archives/
          if-no-files-found: error
  attest:
    needs: [manifest, prepare]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Release Downloads
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-downloads
          path: target/release-archives
      - name: Attest Release Downloads
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: target/release-archives/*
      - name: Attest Image Manifest
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/lorebayai/lorebayd
          subject-digest: ${{ needs.manifest.outputs.digest }}
  release:
    needs: attest
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Download Release Downloads
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-downloads
          path: target/release-archives
      - name: Create Draft Release
        env:
          CI: ''
          GH_TOKEN: ${{ github.token }}
        run: moon run lorebayd:release-publish
