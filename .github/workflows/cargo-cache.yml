name: Cargo Cache

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
      - name: Install Rust Toolchain
        run: rustup toolchain install --no-self-update
      - name: Cache Cargo Dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ci-linux-tests-lib-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Cargo Warmup
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: moon run base:lint cli:lint lorebayd:lint lib/types:lint lib/core:lint lib/mcp:lint schema:lint base:build cli:build lorebayd:build lib/types:build lib/core:build lib/mcp:build schema:build
      - name: Build Test Targets
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: moon run base:test cli:test lorebayd:test lib/types:test lib/core:test lib/mcp:test cli:integration lorebayd:integration lib/core:integration -- --no-run
