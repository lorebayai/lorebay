name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: lorebay_test
          POSTGRES_PASSWORD: lorebay_test
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lorebay_test -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
      - name: Install Rust Toolchain
        run: rustup toolchain install --no-self-update
      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ci-linux-tests-lib-v2
          save-if: 'false'
      - name: Run Moon CI
        run: moon ci
      - name: Install Lock Extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify Action Lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
  image-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      CI: ''
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          moon-version: 2.6.5
          auto-install: false
          cache: false
      - name: Install Rust Toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Build Tools
        run: moon run lorebayd:release-setup
      - name: Build Release Executables
        run: moon run lorebayd:release-build cli:release-build
      - name: Pack Release Archives
        run: moon run lorebayd:release-package cli:release-package
      - name: Build Server Image
        run: moon run deploy:image-build
      - name: Smoke Server Image
        run: moon run deploy:image-smoke
