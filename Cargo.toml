[workspace]
resolver = "3"
members = ["lorebayd"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.0.0"
license = "Apache-2.0"
repository = "https://github.com/lorebayai/lorebay"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
absolute_paths = "deny"
arbitrary_source_item_ordering = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
