[workspace]
resolver = "3"
members = ["base", "lorebayd"]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.27", default-features = false, features = ["json"] }
getrandom = { version = "0.4.3", features = ["std"] }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
lorebay-base = { path = "base" }
mise-dotenv = "2026.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }
typed-builder = "0.23.2"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v7"] }

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.0.0"
license = "Apache-2.0"
repository = "https://github.com/lorebayai/lorebay"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
absolute_paths = "deny"
arbitrary_source_item_ordering = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
