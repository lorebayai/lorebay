[package]
name = "lorebay-lib-core"
description = "Spaces, tasks, and artifact operations for a product."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
lorebay-lib-types.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
typed-builder.workspace = true
uuid.workspace = true

[dev-dependencies]
lorebay-lib-core = { path = ".", features = ["postgres"] }

[[test]]
name = "api"
path = "tests/api/main.rs"

[lints]
workspace = true
