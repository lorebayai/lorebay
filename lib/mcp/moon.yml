language: 'rust'
layer: 'library'

fileGroups:
  rust:
    - '/lib/core/src/**/*'
    - '/lib/types/src/**/*'

tasks:
  card:
    toolchains: ['javascript', 'node', 'typescript']
    command: 'node .moon/check-request-card.mjs'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/.moon/check-request-card.mjs'
      - 'src/request-card.html'
      - '/.prettierrc.json'
      - '/eslint.base.js'
      - '/tsconfig.base.json'
      - '/package.json'
      - '/pnpm-lock.yaml'
      - '/pnpm-workspace.yaml'
