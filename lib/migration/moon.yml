language: 'rust'
layer: 'library'

tasks:
  build:
    args: ['--features', 'entity-generation']
  lint:
    command: 'cargo clippy --all-targets --locked --features entity-generation -- -D warnings'
    options:
      mergeArgs: 'replace'
  test:
    args: ['--features', 'entity-generation']
  generate-entities:
    command: 'bash lib/migration/scripts/generate-entities.sh'
    inputs:
      - '@group(rust)'
      - 'scripts/**/*'
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
